<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="main">
        <img id="pokemon" src="" alt="">
        <div class="buttonContainer">
            <button>5 letters</button>
            <button>6 letters</button>
            <button>7 letters</button>
            <button>8 letters</button>
            <button>9 letters</button>
        </div>
        <div id="textDiv">
            <div id="visual">|</div>
        </div>
        <!-- <img src="filer/keyboard.png" alt=""> -->
        <div class="row R row0">
            <div class="button" id="Escape">esc</div>
            <div class="button" id="F1">F1</div>
            <div class="button" id="F2">F2</div>
            <div class="button" id="F3">F3</div>
            <div class="button" id="F4">F4</div>
            <div class="button" id="AudioVolumeMute">🔇</div>
            <div class="button" id="AudioVolumeDown">🔉</div>
            <div class="button" id="AudioVolumeUp">🔊</div>
            <div class="button" id="F8">F8</div>
            <div class="button" id="F9">F9</div>
            <div class="button" id="F10">F10</div>
            <div class="button" id="F11">✈︎</div>
            <div class="button" id="F12">F12</div>
            <div class="button" id="prt_scr">prt scr</div>
            <div class="button" id="Power">⏻</div>
            <div class="button" id="Delete">delete</div>
        </div>

        <div class="row L row1">
            <div class="button normal" id="Backquote">§</div>
            <div class="button normal columnContainer" id="Digit1">
                <div>!</div>
                <div>1</div>
            </div>
            <div class="button normal columnContainer" id="Digit2">
                    <div>"</div>
                    <div>2</div>
            </div>
            <div class="button normal columnContainer" id="Digit3">
                    <div>#</div>
                    <div>3</div>
            </div>
            <div class="button normal" id="Digit4">4</div>
            <div class="button normal columnContainer" id="Digit5">
                <div>%</div>
                <div>5</div>
            </div>
            <div class="button normal columnContainer" id="Digit6">
                <div>&</div>
                <div>6</div>
            </div>
            <div class="button normal columnContainer" id="Digit7">
                <div>/</div>
                <div>7</div>
            </div>
            <div class="button normal" id="Digit8">8</div>
            <div class="button normal" id="Digit9">9</div>
            <div class="button normal columnContainer" id="Digit0">
                <div>=</div>
                <div>0</div>
            </div>
            <div class="button normal columnContainer" id="Minus">
                <div>?</div>
                <div>+</div>
            </div>
            <div class="button normal columnContainer" id="Equal">
                <div>`</div>
                <div>´</div>
            </div>
            <div class="button" id="Backspace">⟵</div>
            <div class="button normal" id="Home">home</div>
        </div>

        <div class="container">
            <div class="row R row2">
                <div class="button columnContainer" id="Tab">
                    <div>|←</div>
                    <div>→|</div>
                </div>
                <div class="button normal" id="KeyQ">Q</div>
                <div class="button normal" id="KeyW">W</div>
                <div class="button normal" id="KeyE">E</div>
                <div class="button normal" id="KeyR">R</div>
                <div class="button normal" id="KeyT">T</div>
                <div class="button normal" id="KeyY">Y</div>
                <div class="button normal" id="KeyU">U</div>
                <div class="button normal" id="KeyI">I</div>
                <div class="button normal" id="KeyO">O</div>
                <div class="button normal" id="KeyP">P</div>
                <div class="button normal" id="BracketLeft">Å</div>
                <div class="button normal" id="BracketRight">^</div>
            </div>

            <div class="row L row3">
                <div class="button" id="CapsLock">caps lock</div>
                <div class="button normal" id="KeyA">A</div>
                <div class="button normal" id="KeyS">S</div>
                <div class="button normal" id="KeyD">D</div>
                <div class="button normal" id="KeyF">F</div>
                <div class="button normal" id="KeyG">G</div>
                <div class="button normal" id="KeyH">H</div>
                <div class="button normal" id="KeyJ">J</div>
                <div class="button normal" id="KeyK">K</div>
                <div class="button normal" id="KeyL">L</div>
                <div class="button normal" id="Semicolon">Ö</div>
                <div class="button normal" id="Quote">Ä</div>
                <div class="button normal columnContainer" id="Backslash">
                    <div>*</div>
                    <div>'</div>
                </div>
            </div>

            <div class="button R" id="Enter"> ↩</div>
            <div class="button normal R" id="PageUp">pg up</div>
            <div class="button normal R" id="PageDown">pg dn</div>
        </div>

        <div class="row R row4">
            <div class="button normal" id="ShiftLeft">↑</div>
            <div class="button normal columnContainer" id="IntlBackslash">
                <div>></div>
                <div><</div>
            </div>
            <div class="button normal" id="KeyZ">Z</div>
            <div class="button normal" id="KeyX">X</div>
            <div class="button normal" id="KeyC">C</div>
            <div class="button normal" id="KeyV">V</div>
            <div class="button normal" id="KeyB">B</div>
            <div class="button normal" id="KeyN">N</div>
            <div class="button normal" id="KeyM">M</div>
            <div class="button normal columnContainer" id="Comma">
                <div>;</div>
                <div>,</div>
            </div>
            <div class="button normal columnContainer" id="Period">
                <div>:</div>
                <div>.</div>
            </div>
            <div class="button normal columnContainer" id="Slash">
                <div>_</div>
                <div>-</div>
            </div>
            <div class="button" id="ShiftRight">↑</div>
            <div class="button normal" id="End">end</div>
        </div>

        <div class="row L row5">
            <div class="button normal" id="ControlLeft">ctrl</div>
            <div class="button normal" id="Fn">fn</div>
            <div class="button normal columnContainer" id="MetaLeft">
                <div class="squareContainer">
                    <div class="square"></div>
                    <div class="square"></div>
                </div>
                <div class="squareContainer">
                    <div class="square"></div>
                    <div class="square"></div>
                </div>
            </div>
            <div class="button normal" id="AltLeft">alt</div>
            <div class="button" id="Space"></div>
            <div class="button normal" id="AltRight">alt gr</div>
            <div class="button normal columnContainer" id="ContextMenu">
                <div class="menuIcon">≡</div></div>
            <div class="button normal" id="ControlRight">ctrl</div>
            <div class="button normal" id="ArrowLeft"><</div>
            <div class="upNdown_arrow">
                <div class="button" id="ArrowUp">˄</div>
                <div class="button" id="ArrowDown">˅</div>
            </div>
            <div class="button normal" id="ArrowRight">></div>
        </div>
    </main>

    <audio id="fart" src="filer/fart.mp3"></audio>

    <script src="js/script.js"></script>
</body>
</html>
